<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HAIL MARY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg-top:#04070d; --bg-mid:#061018; --bg-bottom:#020609;
  --neb-a:rgba(20,150,110,0.26); --neb-b:rgba(15,120,150,0.22); --neb-c:rgba(30,90,180,0.15);
  --neb-blur:80px;
  --title-font:'Martian Mono','JetBrains Mono',ui-monospace,monospace;
  --accent:#34f0a0;
  --text:#eef4f1;
  --card-bg:rgba(15,25,35,0.88);
  --border:rgba(52,240,160,0.18);
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ 
  height:100%; 
  font-family:var(--title-font); 
  overflow-y:auto; /* Enable scrolling */
  background:radial-gradient(140% 120% at 50% -10%, var(--bg-top) 0%, var(--bg-mid) 42%, var(--bg-bottom) 100%);
  color:var(--text); 
  position:relative;
}

/* Background Layers */
.layer{ position:fixed; inset:0; pointer-events:none; z-index:-10; }
.nebula{ z-index:-9; filter:blur(var(--neb-blur)); }
.nebula span{ position:absolute; border-radius:50%; animation:nebDrift 32s ease-in-out infinite alternate; }
.neb-1{ width:60vw; height:60vw; top:-12%; left:-8%; background:radial-gradient(circle,var(--neb-a),transparent 62%); }
.neb-2{ width:55vw; height:55vw; bottom:-14%; right:-6%; background:radial-gradient(circle,var(--neb-b),transparent 62%); animation-delay:-9s; }
.neb-3{ width:45vw; height:45vw; top:24%; right:18%; background:radial-gradient(circle,var(--neb-c),transparent 60%); animation-delay:-18s; }

.stars{ z-index:-8; }
.star-layer{ position:absolute; top:0; left:0; width:1px; height:1px; border-radius:50%; }

.vignette{ z-index:-2; background:radial-gradient(120% 90% at 50% 45%, transparent 52%, rgba(0,0,0,.78) 100%); }
.grain{ z-index:-1; opacity:0.06; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

/* Header */
header{
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding:1.8rem 5vw; display:flex; justify-content:space-between; align-items:center;
  background:linear-gradient(to bottom, rgba(4,7,13,0.95), transparent);
  border-bottom:1px solid var(--border);
}

.title{
  font-size:clamp(2.2rem, 6vw, 3.8rem); font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:var(--text);
  text-shadow:0 0 30px rgba(52,240,160,.4);
}

/* Archive Header */
.archive-header{
  text-align:center; padding:140px 5vw 60px; position:relative; z-index:2;
}
.archive-header h1{
  font-size:clamp(2.8rem, 7vw, 5rem); 
  margin-bottom:0.5rem;
  text-shadow:0 0 40px rgba(52,240,160,.3);
}
.archive-header p{
  font-size:1.1rem; opacity:0.8; letter-spacing:2px;
}

/* Main Content */
main{ position:relative; z-index:2; padding-bottom:100px; }

/* Game Grid */
.grid-layout{
  display:grid; 
  grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
  gap:2rem; 
  padding:0 5vw; 
  max-width:1800px; 
  margin:0 auto;
}

.game-card{
  background:var(--card-bg); 
  border:1px solid var(--border);
  border-radius:14px; 
  overflow:hidden; 
  transition:all .35s ease;
  backdrop-filter:blur(10px); 
  box-shadow:0 15px 35px rgba(0,0,0,.7);
  cursor:pointer;
}

.game-card:hover{
  transform:translateY(-15px) scale(1.04);
  border-color:var(--accent);
  box-shadow:0 25px 50px rgba(52,240,160,.2);
}

.card-thumb{
  width:100%; height:190px; object-fit:cover;
}

.card-body{ padding:1.1rem 1.3rem; }
.card-title{ font-size:1.15rem; margin-bottom:0.5rem; }
.card-tags{ font-size:0.82rem; opacity:0.75; }

/* Zone Viewer */
#zoneViewer{
  display:none; position:fixed; inset:0; z-index:1000; 
  background:#020609; flex-direction:column;
}

@keyframes nebDrift{ 
  from{transform:translate3d(0,0,0) scale(1);} 
  to{transform:translate3d(3%,-4%,0) scale(1.12);} 
}
</style>
</head>
<body>

<!-- Cosmic Background -->
<div class="layer nebula">
  <span class="neb-1"></span>
  <span class="neb-2"></span>
  <span class="neb-3"></span>
</div>
<div class="layer stars" id="stars"></div>
<div class="layer vignette"></div>
<div class="layer grain"></div>

<header>
  <div class="title">HAIL MARY</div>
</header>

<main>
  <div class="archive-header">
    <h1>GAME ARCHIVE</h1>
    <p>GN MATH</p>
  </div>

  <!-- Search -->
  <div style="text-align:center; margin-bottom:2rem;">
    <input type="text" id="searchBar" placeholder="SEARCH GAMES..." 
           style="background:rgba(255,255,255,0.08); border:1px solid var(--border); color:white; padding:1rem 1.5rem; border-radius:999px; width:380px; font-family:inherit; font-size:1.1rem;">
  </div>

  <div id="modernView">
    <div class="grid-layout" id="allGamesGrid"></div>
  </div>

  <!-- Search Results -->
  <div id="searchView" class="hidden">
    <div class="grid-layout" id="searchResults"></div>
  </div>
</main>

<!-- Zone Viewer -->
<div id="zoneViewer">
  <div style="padding:1.5rem 2rem; background:rgba(4,7,13,0.98); display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border);">
    <div>
      <h2 id="zoneName" style="color:var(--accent); margin:0;">Loading...</h2>
      <a id="zoneAuthor" href="#" target="_blank" style="color:#88ccaa;"></a>
    </div>
    <div style="display:flex; gap:10px;">
      <button onclick="fullscreenZone()">Fullscreen</button>
      <button onclick="aboutBlank()">New Tab</button>
      <button onclick="downloadZone()">Download</button>
      <button onclick="closeZone()" style="background:#e74c3c; color:white;">Close</button>
    </div>
  </div>
  <iframe id="zoneFrame" style="flex:1; border:none; width:100%;"></iframe>
</div>

<script>
// ==================== GAME LOGIC ====================
const CONFIG = {
    zones: "https://cdn.jsdelivr.net/gh/freebuisness/assets@latest/zones.json",
    covers: "https://cdn.jsdelivr.net/gh/freebuisness/covers@main",
    html: "https://cdn.jsdelivr.net/gh/freebuisness/html@main"
};

let state = { games: [] };

async function init() {
    try {
        const res = await fetch(CONFIG.zones + "?t=" + Date.now());
        state.games = await res.json();
        renderGames();
    } catch(e) {
        console.error("Failed to load games", e);
        document.getElementById('allGamesGrid').innerHTML = "<p style='text-align:center;grid-column:1/-1;color:#ff6666;'>Failed to load games.</p>";
    }
}

function resolveUrl(u) {
    return u.replace("{COVER_URL}", CONFIG.covers).replace("{HTML_URL}", CONFIG.html);
}

function createCard(g) {
    return `
    <div class="game-card" onclick="openGame(${g.id})">
        <img src="${resolveUrl(g.cover)}" class="card-thumb" loading="lazy">
        <div class="card-body">
            <div class="card-title">${g.name}</div>
            <div class="card-tags">${(g.special || []).slice(0,2).join(', ') || 'Classic'}</div>
        </div>
    </div>`;
}

function renderGames() {
    const container = document.getElementById('allGamesGrid');
    container.innerHTML = state.games.map(g => createCard(g)).join('');
}

async function openGame(id) {
    const g = state.games.find(x => x.id === id);
    if (!g) return;

    document.getElementById('zoneName').textContent = g.name;
    document.getElementById('zoneAuthor').textContent = g.author ? `by ${g.author}` : '';
    if (g.authorLink) document.getElementById('zoneAuthor').href = g.authorLink;

    const viewer = document.getElementById('zoneViewer');
    viewer.style.display = 'flex';

    try {
        const url = resolveUrl(g.url);
        const resp = await fetch(url + "?t=" + Date.now());
        const html = await resp.text();
        const frame = document.getElementById('zoneFrame');
        frame.contentDocument.open();
        frame.contentDocument.write(html);
        frame.contentDocument.close();
    } catch(e) {
        alert("Could not load game. Try opening in new tab.");
    }
}

function closeZone() {
    document.getElementById('zoneViewer').style.display = 'none';
    document.getElementById('zoneFrame').src = '';
}

function fullscreenZone() {
    const frame = document.getElementById('zoneFrame');
    if (frame.requestFullscreen) frame.requestFullscreen();
}

function aboutBlank() {
    const name = document.getElementById('zoneName').textContent;
    const g = state.games.find(x => x.name === name);
    if (g) window.open(resolveUrl(g.url), '_blank');
}

function downloadZone() {
    const name = document.getElementById('zoneName').textContent;
    const g = state.games.find(x => x.name === name);
    if (!g) return;
    fetch(resolveUrl(g.url)).then(r => r.text()).then(text => {
        const blob = new Blob([text], {type: 'text/html'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = g.name + ".html";
        a.click();
    });
}

// Search
const searchBar = document.getElementById('searchBar');
searchBar.addEventListener('input', () => {
    const q = searchBar.value.toLowerCase().trim();
    const resultsContainer = document.getElementById('searchResults');
    const searchView = document.getElementById('searchView');
    const modernView = document.getElementById('modernView');

    if (!q) {
        searchView.classList.add('hidden');
        modernView.style.display = 'block';
        return;
    }

    modernView.style.display = 'none';
    searchView.classList.remove('hidden');

    const filtered = state.games.filter(g => 
        g.name.toLowerCase().includes(q)
    );

    resultsContainer.innerHTML = filtered.length 
        ? filtered.map(g => createCard(g)).join('') 
        : `<p style="grid-column:1/-1;text-align:center;padding:4rem;color:#888;">No games found for "${q}"</p>`;
});

// Starfield
function createStars() {
    const container = document.getElementById('stars');
    for(let i = 0; i < 900; i++) {
        const star = document.createElement('div');
        star.className = 'star-layer';
        star.style.left = Math.random()*100 + 'vw';
        star.style.top = Math.random()*100 + 'vh';
        star.style.opacity = Math.random() * 0.7 + 0.3;
        star.style.width = star.style.height = (Math.random() * 2.8 + 0.6) + 'px';
        container.appendChild(star);
    }
}

createStars();
init();
</script>
</body>
</html>
