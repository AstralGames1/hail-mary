<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GN MATH</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
/* ====================== HAIL MARY INSPIRED COSMIC THEME ====================== */
:root{
  --bg-top:#04070d; --bg-mid:#061018; --bg-bottom:#020609;
  --neb-a:rgba(20,150,110,0.26); --neb-b:rgba(15,120,150,0.22); --neb-c:rgba(30,90,180,0.15);
  --neb-blur:80px;
  --title-font:'Martian Mono','JetBrains Mono',ui-monospace,monospace;
  --accent:#34f0a0;
  --text:#eef4f1;
  --card-bg:rgba(15,25,35,0.85);
  --border:rgba(52,240,160,0.15);
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; overflow:hidden; }

body{
  background:radial-gradient(140% 120% at 50% -10%, var(--bg-top) 0%, var(--bg-mid) 42%, var(--bg-bottom) 100%);
  color:var(--text); font-family:var(--title-font); position:relative;
  -webkit-font-smoothing:antialiased;
}

/* Background Layers */
.layer{ position:fixed; inset:0; pointer-events:none; z-index:-10; }
.nebula{ z-index:-9; filter:blur(var(--neb-blur)); }
.nebula span{ position:absolute; border-radius:50%; animation:nebDrift 32s ease-in-out infinite alternate; }
.neb-1{ width:60vw; height:60vw; top:-12%; left:-8%; background:radial-gradient(circle,var(--neb-a),transparent 62%); }
.neb-2{ width:55vw; height:55vw; bottom:-14%; right:-6%; background:radial-gradient(circle,var(--neb-b),transparent 62%); animation-delay:-9s; }
.neb-3{ width:45vw; height:45vw; top:24%; right:18%; background:radial-gradient(circle,var(--neb-c),transparent 60%); animation-delay:-18s; }

.stars{ z-index:-8; }
.star-layer{ position:absolute; top:0; left:0; width:1px; height:1px; border-radius:50%; }

.vignette{ z-index:-2; background:radial-gradient(120% 90% at 50% 45%, transparent 52%, rgba(0,0,0,.75) 100%); }
.grain{ z-index:-1; opacity:0.06; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

/* Header / Title */
header{
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding:1.5rem 5vw; display:flex; justify-content:space-between; align-items:center;
  background:linear-gradient(to bottom, rgba(4,7,13,0.95), transparent);
  border-bottom:1px solid var(--border);
}

.title{
  font-family:var(--title-font); font-weight:800; font-size:clamp(1.8rem, 5vw, 3.2rem);
  letter-spacing:.05em; text-transform:uppercase; color:var(--text);
  text-shadow:0 0 30px rgba(52,240,160,.3);
}

.title .triA{
  display:inline-block; width:1ch; vertical-align:baseline; position:relative;
}
.title .triA svg{
  position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  height:0.78em; width:0.68em; overflow:visible; fill:var(--accent);
  filter:drop-shadow(0 0 12px var(--accent));
}

/* Main Content */
main{
  padding-top:100px; min-height:100vh; position:relative; z-index:2;
  padding-bottom:80px;
}

.section-header{
  text-align:center; margin:3rem 0 1.5rem;
  font-size:1.4rem; letter-spacing:0.2em; opacity:0.9;
}

/* Game Cards - Space Style */
.grid-layout{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:1.8rem; padding:0 5vw; max-width:1600px; margin:0 auto;
}

.game-card{
  background:var(--card-bg); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; transition:all .3s ease;
  backdrop-filter:blur(8px); box-shadow:0 10px 30px rgba(0,0,0,.6);
}

.game-card:hover{
  transform:translateY(-12px) scale(1.03);
  border-color:var(--accent);
  box-shadow:0 20px 40px rgba(52,240,160,.15);
}

.card-thumb{
  width:100%; height:180px; object-fit:cover;
  filter:brightness(0.95) contrast(1.1);
}

.card-body{
  padding:1rem 1.2rem;
}

.card-title{
  font-size:1.1rem; margin-bottom:0.4rem; line-height:1.2;
}

.card-tags{
  font-size:0.8rem; opacity:0.7; letter-spacing:0.5px;
}

/* Hero */
.hero{
  text-align:center; padding:8vh 5vw 6vh; position:relative;
}

.hero h1{
  font-size:clamp(3.5rem, 12vw, 9rem); line-height:.9; margin-bottom:1.5rem;
  text-shadow:0 0 40px rgba(52,240,160,.25);
}

/* Controls */
.controls{
  display:flex; justify-content:center; gap:1rem; flex-wrap:wrap;
  margin:2rem 0;
}

/* Modal & Zone Viewer keep original functionality but styled */
.modal-overlay, #zoneViewer{
  background:rgba(2,6,9,0.98) !important;
}

/* Animations */
@keyframes nebDrift{
  from{transform:translate3d(0,0,0) scale(1);}
  to{transform:translate3d(3%,-4%,0) scale(1.12);}
}

@keyframes rise{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:none;}
}
</style>
</head>
<body>

<!-- Background Layers -->
<div class="layer nebula">
  <span class="neb-1"></span>
  <span class="neb-2"></span>
  <span class="neb-3"></span>
</div>
<div class="layer stars" id="stars"></div>
<div class="layer vignette"></div>
<div class="layer grain"></div>

<header>
  <div class="title">
    GN<span class="triA"><svg viewBox="0 0 84 100" preserveAspectRatio="none"><path fill-rule="evenodd" d="M42 2 L82 98 L2 98 Z M42 34 L62 82 L22 82 Z"/></svg></span>ATH
  </div>
  <div class="controls">
    <input type="text" id="searchBar" placeholder="SEARCH ZONES..." 
           style="background:rgba(255,255,255,0.08); border:1px solid var(--border); color:white; padding:0.8rem 1.2rem; border-radius:999px; width:280px; font-family:inherit;">
    <button onclick="toggleTheme()" style="background:rgba(255,255,255,0.1); border:1px solid var(--accent); color:var(--accent);">CLASSIC</button>
  </div>
</header>

<main>
  <!-- Your existing content goes here (grids, sections, etc.) -->
  <div id="modernView">
    <!-- Hero -->
    <div class="hero">
      <h1 style="animation: rise 1.2s ease backwards;">UNBLOCKED ZONES</h1>
      <p style="font-size:1.1rem; opacity:0.8; max-width:600px; margin:0 auto;">
        Cosmic collection of games • proxies • tools
      </p>
    </div>

    <!-- Rest of your original grids, swipers, etc. go here -->
    <!-- (I kept the structure but you can paste your original body content) -->
  </div>
</main>
